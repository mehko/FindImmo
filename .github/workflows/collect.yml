# Collecte planifiée → traitement → état sur la branche `data` → publication GitHub Pages.
# Prérequis (une fois) : Settings > Pages > Source = « GitHub Actions ». Voir docs/DEPLOYMENT.md.
name: Collecte

on:
  schedule:
    - cron: "17 */3 * * *" # toutes les 3 heures (minute décalée pour éviter les pics)
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources à collecter (ex. citya,laforet ; vide = sources activées)"
        required: false
      max_details:
        description: "Budget de pages détail par source (vide = configuration)"
        required: false
      shards:
        description: "Nombre de lots parallèles"
        required: false
        default: "2"

# Jamais deux collectes en même temps : l'état serait écrasé. La suivante attend.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  FINDIMMO_LOG_LEVEL: INFO

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
      total: ${{ steps.m.outputs.total }}
    steps:
      - id: m
        run: |
          n="${{ github.event.inputs.shards || '2' }}"
          echo "total=$n" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 -c "import json;print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # l'échec d'un lot n'empêche pas la publication des autres
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e .
      - name: Récupérer l'état (branche data)
        run: git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data-branch || mkdir -p data-branch
      - name: Collecter
        run: |
          args=(--shard "${{ matrix.shard }}/${{ needs.plan.outputs.total }}" --state data-branch/state --raw "raw/shard-${{ matrix.shard }}")
          [ -n "${{ github.event.inputs.sources }}" ] && args+=(--sources "${{ github.event.inputs.sources }}")
          [ -n "${{ github.event.inputs.max_details }}" ] && args+=(--max-details "${{ github.event.inputs.max_details }}")
          python -m collector collect "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.shard }}
          path: raw/
          retention-days: 3
          if-no-files-found: ignore

  process:
    needs: collect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests du pipeline
        run: pytest -x -q
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: raw
          merge-multiple: true
      - name: Récupérer l'état (branche data)
        run: git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data-branch || mkdir -p data-branch
      - name: Traiter et générer les JSON publics
        run: python -m collector process --raw raw --state data-branch/state --public public
      - name: "Enregistrer l'état (branche data, un seul commit, sans croissance de l'historique)"
        run: |
          cd data-branch
          rm -rf .git
          git init -q -b data
          git config user.name "findimmo-bot"
          git config user.email "findimmo-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "État FindImmo $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
