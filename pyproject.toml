[project]
name = "findimmo-collector"
version = "0.1.0"
description = "FindImmo Collector — collecte, normalisation et publication d'annonces immobilières"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "pydantic>=2.7,<3",
  "pyyaml>=6",
  "protego>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Playwright n'est installé que si une source déclare `render: playwright`.
browser = ["playwright>=1.45"]

[project.scripts]
findimmo = "collector.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["collector*"]
exclude = ["collector.tests*"]

[tool.pytest.ini_options]
testpaths = ["collector/tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
