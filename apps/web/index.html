<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b5f59" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1215" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="FindImmo — veille immobilière personnelle" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>FindImmo</title>
    <script>
      // Thème appliqué avant le rendu pour éviter un flash.
      try {
        var t = localStorage.getItem("findimmo-theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
