# Registre des sources FindImmo.
#
# Champs : voir collector/config.py (SourceConfig) et docs/SOURCES.md.
# Statut de compatibilité : compatible | partial | pending_validation | blocked | incompatible | fixture
# Seules les sources `enabled: true` sont collectées. robots.txt est toujours respecté.
# Évaluations du 2026-11-08 (voir docs/SOURCES.md pour le détail).

sources:
  # --------------------------------------------------------------------------- sources actives
  - id: citya
    name: Citya Immobilier
    domain: www.citya.com
    url: https://www.citya.com
    network: Citya
    cms: propriétaire (Symfony) — JSON-LD schema.org RealEstateListing
    method: sitemap_jsonld
    enabled: true
    compatibility: compatible
    rate_limit_seconds: 1.5
    max_details_per_run: 250
    refresh_days: 3
    options:
      sitemaps:
        - https://www.citya.com/sitemap.vente.xml
        - https://www.citya.com/sitemap.location.xml
      # Le code postal est dans l'URL : pré-filtrage géographique sans requête.
      url_pattern: 'citya\.com/annonces/(?P<transaction>vente|location)/[^/]+/[^/]+-(?P<postal_code>\d{5})/(?P<ref>[A-Za-z0-9-]+)$'
      transaction_from_url:
        /annonces/vente/: sale
        /annonces/location/: rent
      # Certaines annonces (parkings, nouvelles annonces) n'ont pas de JSON-LD : lecture des balises.
      fallback_fields:
        title: { selector: "meta[property='og:title']", attr: content }
        price: { selector: "meta[property='og:title']", attr: content, regex: '- ([\d\s  ]+)€' }
        city: { selector: "meta[property='og:title']", attr: content, regex: '- ([^-]+?) \(\d{2,3}\)' }
        image: { selector: "meta[property='og:image']", attr: content }
        latitude: { selector: "[data-latitude]", attr: data-latitude }
        longitude: { selector: "[data-longitude]", attr: data-longitude }
    notes: >
      JSON-LD complet (prix, surface, pièces, GPS, DPE/GES, équipements). Les booléens « false » des
      équipements sont parfois faux (ex. cave mentionnée dans la description) : ignorés.

  - id: laforet
    name: Laforêt Immobilier (réseau)
    domain: www.laforet.com
    url: https://www.laforet.com
    network: Laforêt
    cms: plateforme réseau Laforêt (Laravel/Stimulus)
    method: adapter
    adapter: laforet
    enabled: true
    compatibility: partial
    rate_limit_seconds: 1.5
    max_details_per_run: 250
    refresh_days: 4
    options:
      sitemaps:
        - https://www.laforet.com/storage/sitemaps/produits.xml
    notes: >
      Données structurées dans le dataLayer ; DPE uniquement sous forme d'image (non extrait).
      Pré-filtrage par slug de commune dans l'URL.

  - id: century21-beaurepaire-colombes
    name: Century 21 Beaurepaire (Colombes)
    domain: www.century21-beaurepaire-colombes.com
    url: https://www.century21-beaurepaire-colombes.com
    network: Century 21
    method: sitemap_jsonld
    enabled: true
    compatibility: compatible
    departments: ["92"]
    rate_limit_seconds: 1.5
    max_details_per_run: 100
    refresh_days: 3
    options:
      sitemaps: [https://www.century21-beaurepaire-colombes.com/sitemap.xml]
      url_pattern: 'century21-beaurepaire-colombes\.com/trouver_logement/detail/(?P<ref>\d+)/?$'
      transaction_from_title: { "à vendre": sale, "à louer": rent }
    notes: >
      Site propre à l'agence de Colombes (~36 annonces) : JSON-LD Offer + bien (prix, surface, pièces,
      code postal). Pas de transaction dans l'URL : déduite du JSON-LD/titre.

  - id: human-immobilier
    name: HUMAN Immobilier (Colombes)
    domain: www.human-immobilier.fr
    url: https://www.human-immobilier.fr
    network: HUMAN Immobilier
    cms: plateforme réseau HUMAN (ASP.NET) — JSON-LD RealEstateListing sur les pages détail
    method: adapter
    adapter: human
    enabled: true
    compatibility: compatible
    departments: ["92"]
    rate_limit_seconds: 1.5
    max_details_per_run: 100
    refresh_days: 3
    options:
      # Le sitemap ne contient pas les annonces : découverte par les pages de résultats de la commune.
      list_pages: [https://www.human-immobilier.fr/achat-immobilier-colombes]
      cities: [colombes]
      max_pages: 5
    notes: >
      Vente uniquement (pas de page de location par commune). Annonces « Vendu » traitées comme retirées.
      Coordonnées GPS de la page = agence, ignorées. Pour une autre commune : ajouter sa page de
      résultats dans list_pages et son slug dans cities.

  - id: remax
    name: RE/MAX France (réseau)
    domain: remax.fr
    url: https://remax.fr
    network: RE/MAX
    cms: Next.js — données complètes dans __NEXT_DATA__ (listingEncoded, base64)
    method: adapter
    adapter: remax
    enabled: true
    compatibility: compatible
    rate_limit_seconds: 1.5
    max_details_per_run: 250
    refresh_days: 4
    options:
      # Index national : seul le sous-sitemap listings_details_fr_* contient les annonces (~3 100) ;
      # le reste (~8 M d'URL) est constitué de pages de recherche, jamais téléchargées.
      sitemaps: [https://remax.fr/sitemap.xml]
      include_sitemaps: 'listings_details_fr'
    notes: >
      Département et commune dans l'URL : pré-filtrage géographique sans requête. Beaucoup de mandats du
      sitemap sont vendus (isSold) : traités comme retirés. GPS repris seulement si l'adresse est exacte.
      Niveaux DPE/GES 1 à 7 = A à G (déduit d'une fiche affichant « C » pour le niveau 3).

  # Démonstration : les sources fictives « demo » et « demo-bis » sont définies dans collector/demo.py
  # (commande `python -m collector demo`) et ne sont jamais collectées en production.

  # --------------------------------------------------------------------------- évaluées, inactives
  - id: century21
    name: Century 21 France
    domain: www.century21.fr
    url: https://www.century21.fr
    network: Century 21
    method: sitemap_jsonld
    enabled: false
    compatibility: incompatible
    notes: >
      Sitemap accessible (~35 000 annonces nationales) mais URL sans localisation et pages détail
      sans JSON-LD : il faudrait télécharger toutes les pages de France. Adaptateur HTML à écrire.

  - id: capifrance
    name: Capifrance
    domain: www.capifrance.fr
    url: https://www.capifrance.fr
    method: sitemap_jsonld
    enabled: false
    compatibility: blocked
    notes: Protection Cloudflare (challenge JavaScript) sur le sitemap. Non contourné.

  - id: stephaneplaza
    name: Stéphane Plaza Immobilier
    domain: www.stephaneplazaimmobilier.com
    url: https://www.stephaneplazaimmobilier.com
    method: html
    enabled: false
    compatibility: blocked
    notes: 403 sur robots.txt → considéré comme interdit.

  - id: safti
    name: SAFTI
    domain: www.safti.fr
    url: https://www.safti.fr
    method: html
    enabled: false
    compatibility: blocked
    notes: 403 sur robots.txt → considéré comme interdit.

  - id: iad
    name: iad France
    domain: www.iadfrance.fr
    url: https://www.iadfrance.fr
    method: sitemap_jsonld
    enabled: false
    compatibility: pending_validation
    options:
      sitemaps: [https://www.iadfrance.fr/sitemap/fr/ads.xml]
      url_pattern: 'iadfrance\.fr/annonce/[a-z]+-(?P<transaction>vente|location)-[^/]*?-(?P<city>[a-z-]+)-\d+m2/(?P<ref>r\d+)$'
    notes: Sitemap avec commune dans l'URL ; extraction de la page détail non évaluée.

  - id: guyhoquet
    name: Guy Hoquet
    domain: www.guy-hoquet.com
    url: https://www.guy-hoquet.com
    method: sitemap_jsonld
    enabled: false
    compatibility: pending_validation
    notes: sitemap-index accessible ; structure des pages détail non évaluée.
