        - https://www.hosman.co/b/achat-rueil-malmaison
        - https://www.hosman.co/b/achat-saint-cloud
        - https://www.hosman.co/b/achat-sevres
        - https://www.hosman.co/b/achat-suresnes
        - https://www.hosman.co/b/achat-vanves
        - https://www.hosman.co/b/achat-vaucresson
        - https://www.hosman.co/b/achat-ville-d'avray
      link_selector: "a[href^='/a/']"
      # /a/vente-appartement-41m2-92700-colombes-75de31
      url_pattern: '/a/(?P<transaction>vente|location)-(?P<type>[a-z-]+?)-(?P<surface>\d+)m2-(?P<postal_code>\d{5})-(?P<city>.+)-(?P<ref>[0-9a-f]{4,8})$'
      transaction_from_url: { /a/vente-: sale, /a/location-: rent }
      # Bandeau de statut rouge (vide sur un bien disponible). Son texte n'a pas pu être observé sur un bien vendu : la règle
      # est volontairement étroite (elle ne retire que sur un mot explicite) ; une fiche supprimée ou redirigée est déjà retirée.
      removed_if:
        - { selector: "div.bg-ih-red-80", regex: '(?i)vendu|sous offre|sous compromis|indisponible|plus disponible' }
      fields:
        title: { selector: "meta[property='og:title']", attr: content }
        # « Appartement - Rue Maurice Berteaux, 92700 Colombes » puis « 3 pièces — 41.2 m² — 2 chambres » puis « 260 000 € »
        property_type: { selector: "main p.text-xl.font-semibold", regex: '^(.+?)\s+-\s' }
        postal_code: { selector: "main p.text-xl.font-semibold", regex: '\b(\d{5})\b' }
        city: { selector: "main p.text-xl.font-semibold", regex: '\b\d{5}\s+(.+)$' }
        rooms: { selector: "main p.text-ih-neutral-70.text-sm", regex: '(\d+)\s*pièces?' }
        surface: { selector: "main p.text-ih-neutral-70.text-sm", regex: '(\d+(?:[.,]\d+)?)\s*m²' }
        bedrooms: { selector: "main p.text-ih-neutral-70.text-sm", regex: '(\d+)\s*chambres?' }
        price: "main p.text-2xl.font-bold"
        image: { selector: "meta[property='og:image']", attr: content }
    notes: >
      Vente uniquement (la location est de la gestion). Source en découverte partielle : une absence ne retire jamais une
      annonce ; seules une page supprimée/redirigée ou le bandeau « vendu » le font. DPE non exposé.

