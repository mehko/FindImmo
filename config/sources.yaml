  - id: gridimmo
    name: Gridimmo (Colombes)
    domain: www.gridimmo.fr
    url: https://www.gridimmo.fr
    cms: moteur propriétaire (pages .html, listes ul.list-4) — pas de données structurées
    method: html
    enabled: true
    compatibility: compatible
    rate_limit_seconds: 1.5
    max_details_per_run: 100
    refresh_days: 3
    options:
      sitemaps: [https://www.gridimmo.fr/sitemap.xml]
      # Le sitemap contient chaque annonce en FR et en EN : on ne garde que la version française.
      # Commune dans l'URL : pré-filtrage géographique sans requête.
      url_pattern: '/fr/annonces-immobilieres/offre/(?P<city>[a-z0-9-]+)/bien/(?P<ref>\d+)/[^/]+\.html$'
      transaction_from_text:
        selector: "p.alignleft:-soup-contains('Prix')"
        rules: { '/\s*mois': rent }
        default: sale
      fields:
        title: { selector: "meta[property='og:title']", attr: content }
        # Titre : « Appartement - Colombes - Réf.:3609 » ou « Location non meublée - Appartement - La garenne-colombes - Réf.:… »
        property_type: { selector: "#desc h3.headline", regex: '^(?:Location (?:non )?meublée\s-\s)?(.+?)\s-\s' }
        city: { selector: "#desc h3.headline", regex: '^(?:Location (?:non )?meublée\s-\s)?.+?\s-\s(.+?)\s-\s' }
        # « Prix : 319.000 € honoraires à charge du vendeur », « Prix honoraires inclus : 289.000 € », « Prix : 90 € /mois CC »
        price: { selector: "p.alignleft:-soup-contains('Prix')", regex: '(\d[\d.\s ]*?)\s*€' }
        rooms: { selector: "ul.list-4 li:-soup-contains('Pièce')", regex: '(\d+)\s*Pi' }
        bedrooms: { selector: "ul.list-4 li:-soup-contains('Chambre')", regex: '(\d+)\s*Chambre' }
        surface: { selector: "ul.list-4 li:-soup-contains('Surface habitable')", regex: '(\d+(?:[.,]\d+)?)\s*m' }
        postal_code: { selector: "#details", regex: 'Code postal\s*:\s*(\d{5})' }
        dpe: { selector: "#details", regex: 'primaire\)\s*:\s*[\d.,]+\s*KWHep/m²an\s*([A-G])\b' }
        ges: { selector: "#details", regex: 'serre\s*:\s*[\d.,]+\s*KgCO²/m²an\s*([A-G])\b' }
        description: { selector: "#desc p" }
        image: { selector: "meta[property='og:image']", attr: content }
    notes: >
      Petite agence de Colombes (~40 annonces FR, dont ~12 locations). Le sitemap ne liste que des annonces en cours
      (aucun marqueur « vendu » : les occurrences de ce mot sont des descriptions de biens « vendus occupés »).
      Code postal absent de certaines fiches : la commune dans l'URL sert au pré-filtrage.

  - id: louzi-immobilier
    name: Louzi Immobilier (Argenteuil)
    domain: www.louzi-immobilier.com
    url: https://www.louzi-immobilier.com
    cms: IWS Création (Next.js, rendu serveur) — pas de données structurées
    method: html
    enabled: true
    compatibility: compatible
    rate_limit_seconds: 1.5
    max_details_per_run: 100
    refresh_days: 3
    options:
      # Le sitemap ne contient pas les annonces : découverte par la liste complète (10 par page, ~38 biens).
      list_pages: [https://www.louzi-immobilier.com/biens-immobiliers/tous/tous]
      list_page_param: page
      link_selector: "a[href*='/annonce-immobiliere/']"
      # …/colombes-92700/achat/appartement/appartement-t2/2148-727060-1074595 : code postal dans l'URL → pré-filtrage.
      url_pattern: '/annonce-immobiliere/[^/]+/[^/]+/(?P<city>[a-z0-9-]+?)-(?P<postal_code>\d{5})/(?P<transaction>achat|location)/.+/(?P<ref>\d+-\d+-\d+)$'
      transaction_from_url: { /achat/: sale, /location/: rent }
      fields:
        title: { selector: "meta[property='og:title']", attr: content }
        # Titre : « Appartement T2 174000 € à Colombes »
        property_type: { selector: "meta[property='og:title']", attr: content, regex: '^(.+?)\s+\d[\d\s]*€' }
        city: { selector: "meta[property='og:title']", attr: content, regex: ' à (.+)$' }
        postal_code: { selector: "h1", regex: '\(\s*(\d{5})\s*\)' }
        price: "span.font-bold.text-primary-600"
        surface: { selector: "li:-soup-contains('Surface')", regex: '(\d+(?:[.,]\d+)?)\s*m' }
        rooms: { selector: "li:-soup-contains('Pièces')", regex: '(\d+)\s*$' }
        bedrooms: { selector: "li:-soup-contains('Chambres')", regex: '(\d+)\s*$' }
        description: "p.whitespace-pre-wrap"
        image: { selector: "meta[property='og:image']", attr: content }
    notes: >
      Agence d'Argenteuil (95) ; quelques biens à Colombes, Gennevilliers, Bezons… filtrés par les départements
      configurés. La liste complète est paginée (?page=N) jusqu'à une page vide. DPE non exposé.

  - id: asm-immobilier
    name: ASM Immobilier (Courbevoie)
    domain: www.asm-immobilier.fr
    url: https://www.asm-immobilier.fr
    network: ASM Immobilier
    cms: WordPress + Houzez + Elementor — JSON-LD RealEstateListing sans prix
    method: sitemap_jsonld
    enabled: true
    compatibility: compatible
    rate_limit_seconds: 1.5
    max_details_per_run: 100
    refresh_days: 3
    options:
      sitemaps: [https://www.asm-immobilier.fr/property-sitemap.xml]
      url_pattern: '/bien/(?P<ref>[^/]+)/$'
      # Statut du bien (liste « détails ») ou fil d'Ariane : « Vendu » / « Loué » → retiré. Les étiquettes
      # « Vendu » / « Déjà loué » de la page NE sont PAS fiables (elles appartiennent aux fiches similaires).
      removed_if:
        - { selector: ".detail-wrap .list-lined-item:has(> strong:-soup-contains-own('Statut de propriété')) > span", regex: 'Vendu|Loué' }
        - { selector: "li.breadcrumb-item", regex: '^(Vendu|Loué|Déjà loué)$' }
      # Le JSON-LD donne surface, adresse (CP et commune du BIEN) et nom, mais pas le prix.
      supplement_fields:
        price: ".detail-wrap .list-lined-item:has(> strong:-soup-contains-own('Prix')) > span"
        rooms: ".detail-wrap .list-lined-item:has(> strong:-soup-contains-own('Pièces')) > span"
        property_type: ".detail-wrap .list-lined-item:has(> strong:-soup-contains-own('Type de bien')) > span"
        transaction: ".detail-wrap .list-lined-item:has(> strong:-soup-contains-own('Statut de propriété')) > span"
    notes: >
      ~500 pages /bien/ dont environ la moitié sont vendues ou louées (archives conservées). Le « 92400 » visible dans
      le texte de la page est l'adresse de l'agence : le code postal du bien vient du JSON-LD. Agence de Courbevoie qui
      propose aussi Paris, Puteaux, Colombes, etc. ; filtrage géographique par les départements configurés après lecture.

