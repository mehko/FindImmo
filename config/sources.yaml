# Registre des sources FindImmo.
#
# Champs : voir collector/config.py (SourceConfig) et docs/SOURCES.md.
# Statut de compatibilité : compatible | partial | pending_validation | blocked | incompatible | fixture
# Seules les sources `enabled: true` sont collectées. robots.txt est toujours respecté.
# Évaluations du 2026-11-08 (voir docs/SOURCES.md pour le détail).
#
# Option `min_interval_hours: N` (dans `options`) : écart minimal entre deux tentatives sur une source lourde ou sensible ; une
# source ignorée n'a pas de lot et ses annonces ne changent pas de statut.
# Option `run_hours_utc: [début, fin]` : plage d'heures UTC (incluse) hors de laquelle la source est ignorée (lots nocturnes Figaro).
# Champs `attribution` et `hide_unavailable` (niveau source) : mention affichée dans l'interface ; ne pas publier les annonces retirées.
#
# Option `partial_discovery: true` (dans `options`) : la source ne peut pas énumérer toutes ses annonces. Une absence ne retire
# jamais une annonce ; les annonces connues mais non redécouvertes sont revérifiées par leur page (voir docs/SOURCES.md, Hosman).

sources:
  # --------------------------------------------------------------------------- sources actives
  - id: citya
    name: Citya Immobilier
    domain: www.citya.com
    url: https://www.citya.com
    network: Citya
    cms: propriétaire (Symfony) — JSON-LD schema.org RealEstateListing
    method: sitemap_jsonld
    enabled: true
    compatibility: compatible
    rate_limit_seconds: 1.5
    max_details_per_run: 250
    refresh_days: 3
    options:
      sitemaps:
        - https://www.citya.com/sitemap.vente.xml
        - https://www.citya.com/sitemap.location.xml
      # Le code postal est dans l'URL : pré-filtrage géographique sans requête.
      url_pattern: 'citya\.com/annonces/(?P<transaction>vente|location)/[^/]+/[^/]+-(?P<postal_code>\d{5})/(?P<ref>[A-Za-z0-9-]+)$'
      transaction_from_url:
        /annonces/vente/: sale
        /annonces/location/: rent
      # Certaines annonces (parkings, nouvelles annonces) n'ont pas de JSON-LD : lecture des balises.
      fallback_fields:
        title: { selector: "meta[property='og:title']", attr: content }
        price: { selector: "meta[property='og:title']", attr: content, regex: '- ([\d\s  ]+)€' }
        city: { selector: "meta[property='og:title']", attr: content, regex: '- ([^-]+?) \(\d{2,3}\)' }
        image: { selector: "meta[property='og:image']", attr: content }
        latitude: { selector: "[data-latitude]", attr: data-latitude }
        longitude: { selector: "[data-longitude]", attr: data-longitude }
    notes: >
      JSON-LD complet (prix, surface, pièces, GPS, DPE/GES, équipements). Les booléens « false » des
      équipements sont parfois faux (ex. cave mentionnée dans la description) : ignorés.

