  - id: arthurimmo-colombes
    name: Arthurimmo Colombes
    domain: colombes.arthurimmo.com
    url: https://colombes.arthurimmo.com
    network: Arthurimmo
    cms: plateforme Arthurimmo (studio-net, Tailwind) — pas de données structurées sur les annonces
    method: html
    enabled: true
    compatibility: compatible
    rate_limit_seconds: 1.5
    max_details_per_run: 100
    refresh_days: 3
    options:
      sitemaps: [https://colombes.arthurimmo.com/sitemap.xml]
      # Code postal dans l'URL : pré-filtrage géographique sans requête.
      url_pattern: '/annonces/(?P<transaction>achat|location)/(?P<type>[a-z-]+)/(?P<city>[a-z-]+)-(?P<postal_code>\d{5})/(?P<ref>\d+)\.htm$'
      transaction_from_url: { /annonces/achat/: sale, /annonces/location/: rent }
      fields:
        title: { selector: "meta[property='og:title']", attr: content }
        # Titre type : « Acheter appartement de 4 pièces 77 m² 340 000 € à Colombes (92700) : … »
        property_type: { selector: "meta[property='og:title']", attr: content, regex: '^(?:Acheter|Louer) (.+?)(?: de \d| \d| à )' }
        price: { selector: "meta[property='og:title']", attr: content, regex: '([\d  ]+) ?€' }
        surface: { selector: "meta[property='og:title']", attr: content, regex: '(\d+(?:[.,]\d+)?) m²' }
        rooms: { selector: "meta[property='og:title']", attr: content, regex: '(\d+) pièces?' }
        city: { selector: "meta[property='og:title']", attr: content, regex: ' à (.+?) \(\d{5}\)' }
        postal_code: { selector: "meta[property='og:title']", attr: content, regex: '\((\d{5})\)' }
        bedrooms: { selector: "li:-soup-contains('Nombre de chambres') > div:last-child" }
        description: { selector: "meta[property='og:description']", attr: content }
        image: { selector: "meta[property='og:image']", attr: content }
    notes: >
      Données lues dans le titre OpenGraph et la liste « libellé / valeur ». Description tronquée par le site
      (méta). DPE et GPS non extraits (classe DPE non exposée en texte ; coordonnées de précision incertaine).
      L'agence vend aussi hors Colombes (95, 78, 75) : filtrage par les départements configurés.

  - id: lesagentsdelimmobilier
    name: Les Agents de l'Immobilier
    domain: www.lesagentsdelimmobilier.com
    url: https://www.lesagentsdelimmobilier.com
    network: Les Agents de l'Immobilier
    cms: WordPress + Elementor + thème Houzez (immo-facile) — pas de données structurées sur les annonces
    method: html
    enabled: true
    compatibility: compatible
    rate_limit_seconds: 1.5
    max_details_per_run: 120
    refresh_days: 4
    options:
      # Sous-sitemap WordPress du type « property » (annonces en cours ; les biens vendus sont dans « vendus »).
      sitemaps: [https://www.lesagentsdelimmobilier.com/wp-sitemap-posts-property-1.xml]
      url_pattern: '/annonces/(?P<ref>[^/]+)/?$'
      fields:
        title: { selector: "meta[property='og:title']", attr: content }
        price: ".detail-wrap li:has(> strong:-soup-contains-own('Prix')) > span"
        surface: ".detail-wrap li:has(> strong:-soup-contains-own('Superficie')) > span"
        rooms: ".detail-wrap li:has(> strong:-soup-contains-own('Nb pièces')) > span"
        bedrooms: ".detail-wrap li:has(> strong:-soup-contains-own('Chambre')) > span"
        property_type: ".detail-wrap li:has(> strong:-soup-contains-own('Type de bien')) > span"
        postal_code: ".detail-wrap li:has(> strong:-soup-contains-own('Code postal')) > span"
        city: { selector: ".detail-wrap li:has(> strong:-soup-contains-own('Ville')) > span", regex: '\d{5} (.+)$' }
        # Classe de l'annonce : property_status-acheter | property_status-louer
        transaction: { selector: "[class*='property_status-']", attr: class, regex: 'property_status-([a-z]+)' }
        description: { selector: "meta[property='og:description']", attr: content }
        image: { selector: "meta[property='og:image']", attr: content }
    notes: >
      URL sans commune : la localisation (CP, ville) n'est connue qu'après lecture de la page, donc pas de
      pré-filtrage géographique ; ~330 annonces, couvertes en quelques collectes. DPE lu dans le texte
      de la description (« DPE : E ») quand il est présent. Réseau présent surtout autour de Paris et d'Orléans.

  - id: eraimmobilier
    name: ERA Immobilier (réseau, Hauts-de-Seine)
    domain: www.eraimmobilier.com
    url: https://www.eraimmobilier.com
    network: ERA Immobilier
    cms: Angular (SSR) — résultats de recherche complets dans le bloc ng-state
    method: adapter
    adapter: era
    enabled: true
    compatibility: compatible
    departments: ["92"]
    rate_limit_seconds: 1.5
    max_details_per_run: 250
    max_run_seconds: 900
    refresh_days: 3
    options:
      # Pages de résultats du département 92 (10 annonces par page, annonces complètes incluses).
      # Pour un autre département : ajouter ses pages /achat/<région>/<département> et /location/…
      list_pages:
        - https://www.eraimmobilier.com/achat/ile-de-france-1/hauts-de-seine-97
        - https://www.eraimmobilier.com/location/ile-de-france-1/hauts-de-seine-97
      max_pages: 60
    notes: >
      Le sitemap (~13 000 URL /annonces/<id> sans localisation) n'est pas utilisé. Chaque page de résultats
      embarque la réponse de recherche du site avec les annonces complètes : ~45 requêtes pour tout le 92,
      sans télécharger les fiches. Mandats vendus déjà exclus par le site (statut 0,1,11). GES et GPS
      absents/ignorés (le GPS est celui du centre de la commune).

  - id: act-immo
    name: Act'Immo 92 (Colombes)
    domain: www.act-immo.net
    url: https://www.act-immo.net
    cms: Hektor (LBI) — pas de données structurées sur les annonces
    method: adapter
    adapter: hektor
    enabled: true
    compatibility: compatible
    rate_limit_seconds: 1.5
    max_details_per_run: 100
    refresh_days: 3
    options:
      sitemaps: [https://www.act-immo.net/sitemap.xml]
      # Commune dans l'URL : pré-filtrage géographique sans requête. Les biens vendus sont sous /biens-vendus/.
      url_pattern: '/(?P<transaction>vente|location)/\d+-(?P<city>[a-z-]+)/(?P<type>[a-z-]+)/(?P<ref>\d+)-[^/]+$'
      transaction_from_url: { /vente/: sale, /location/: rent }
      fields:
        title: { selector: "meta[property='og:title']", attr: content }
        property_type: { selector: "h1.properties-detail__title", regex: '^([^\d(]+?)\s*(?:\d|$)' }
        price: ".properties-detail__price"
        surface: { selector: "h1.properties-detail__title", regex: '(\d+(?:[.,]\d+)?)\s*m²' }
        rooms: { selector: "h1.properties-detail__title", regex: '(\d+)\s*pièces?' }
        bedrooms: { selector: "h1.properties-detail__title", regex: '(\d+)\s*chambres?' }
        city: { selector: ".title-v1__part1", regex: '^(.+?)\s*\(\d{5}\)' }
        postal_code: { selector: ".title-v1__part1", regex: '\((\d{5})\)' }
        description: { selector: "meta[property='og:description']", attr: content }
        image: { selector: "meta[property='og:image']", attr: content }
    notes: >
      Thème Hektor « properties-detail » (adaptateur `hektor`) : type, pièces, chambres et surface lus dans le titre H1 ; commune et code postal dans le premier bloc « title-v1 ». DPE lu dans le texte de la page (« classe G ») quand présent. Prix du bandeau souvent vide : reconstitué depuis le prix net vendeur et le taux d'honoraires (champ marqué « parsed »). GPS non repris.

