    options:
      # DÉCOUVERTE PARTIELLE : la liste complète n'est chargée que par /api/v1/properties, interdit par robots.txt.
      # Seules les pages publiques /b/achat-<ville> sont lues : elles n'affichent que 9 fiches chacune (carrousel).
      # Les 200 pages /t/achat-<type>-<ville> du 92 n'ajoutent aucune fiche : ces 25 pages donnent 62 fiches, vraisemblablement
      # le catalogue complet (mesure du 2026-11-10). Les annonces connues mais non redécouvertes sont revérifiées par leur page.
